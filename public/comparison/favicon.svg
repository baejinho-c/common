<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="여행 견적 비교함">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#0D9488"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
  <!-- left card -->
  <rect x="6.5" y="11" width="8" height="11" rx="1.6" fill="#ffffff" opacity="0.95"/>
  <!-- right card -->
  <rect x="17.5" y="9.5" width="8" height="12.5" rx="1.6" fill="#ffffff"/>
  <!-- divider -->
  <path d="M16 10.5v12" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- lines on cards -->
  <rect x="8" y="13.5" width="5" height="1.2" rx="0.6" fill="#0D9488" opacity="0.55"/>
  <rect x="8" y="16" width="3.8" height="1.2" rx="0.6" fill="#0D9488" opacity="0.4"/>
  <rect x="19" y="12" width="5" height="1.2" rx="0.6" fill="#0284C7" opacity="0.55"/>
  <rect x="19" y="14.5" width="3.8" height="1.2" rx="0.6" fill="#0284C7" opacity="0.4"/>
  <!-- check on cheaper -->
  <circle cx="21.5" cy="19.2" r="2" fill="#34D399"/>
  <path d="M20.4 19.2l0.8 0.8 1.5-1.5" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- plane -->
  <path d="M22 7.2l3.2 1.1-1.1 3.2-1.2-1.2-1.6.9.3-1.7z" fill="#FEF08A"/>
</svg>
