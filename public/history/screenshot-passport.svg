<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="낙관 여권 수집 화면">
  <rect width="640" height="400" rx="16" fill="#1b2e3c"/>
  <rect x="120" y="40" width="400" height="320" rx="14" fill="#ede2c9"/>
  <text x="320" y="92" text-anchor="middle" font-family="serif" font-size="20" font-weight="700" fill="#1b2e3c">역사 여권</text>
  <circle cx="220" cy="220" r="42" fill="#ae3b2e" opacity="0.2" stroke="#ae3b2e" stroke-width="2"/>
  <text x="220" y="228" text-anchor="middle" font-family="serif" font-size="28" fill="#ae3b2e">高</text>
  <circle cx="320" cy="220" r="42" fill="#ae3b2e" opacity="0.2" stroke="#ae3b2e" stroke-width="2"/>
  <text x="320" y="228" text-anchor="middle" font-family="serif" font-size="28" fill="#ae3b2e">朝</text>
