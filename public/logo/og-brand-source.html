<!DOCTYPE html>
<html lang="ko" data-resty-tenant="logo">
<head>
<base href="/logo/">
<meta charset="utf-8"/>
<meta name="viewport" content="width=1200, height=630"/>
<title>LogoStage - AI 로고 생성기 · Brand OG</title>
<style>
:root{
    --p: #1860f0;
    --s: #1878c0;
    --a: #1878c0;
    --bg: #FFFFFF;
    --fg: #0F172A;
    --shell: rgba(255,255,255,.88);
    --panel: rgba(15,23,42,.04);
    --panel-strong: rgba(15,23,42,.06);
    --border: rgba(15,23,42,.10);
    --muted: rgba(15,23,42,.55);
    --typed: #0F172A;
    --w: 1200px;
    --h: 630px;
  }

@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:var(--w);height:var(--h);margin:0;overflow:hidden;
  font-family:'IBM Plex Sans KR','Instrument Sans',system-ui,sans-serif;
  color:var(--fg);background:var(--bg);
}
body{position:relative}
.stage{
  position:absolute;left:0;top:0;
  width:var(--w);height:var(--h);
  overflow:hidden;background:var(--bg);
  transform-origin:0 0;
}
.bg{
  position:absolute;inset:-20%;
  background:
    radial-gradient(ellipse 55% 45% at 12% 20%, color-mix(in srgb, var(--p) 38%, transparent), transparent 70%),
    radial-gradient(ellipse 45% 40% at 88% 18%, color-mix(in srgb, var(--s) 28%, transparent), transparent 65%),
    radial-gradient(ellipse 50% 45% at 70% 90%, color-mix(in srgb, var(--a) 22%, transparent), transparent 70%),
    var(--bg);
  animation: mesh 16s ease-in-out infinite alternate;
  transform: translate3d(calc(var(--mx,0)*8px), calc(var(--my,0)*6px), 0);
}
@keyframes mesh{
  0%{filter:saturate(1)}
  100%{filter:saturate(1.15) hue-rotate(10deg)}
}
.noise{
  position:absolute;inset:0;opacity:.14;pointer-events:none;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.glow{
  position:absolute;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb, var(--p) 42%, transparent), transparent 70%);
  filter:blur(22px); right:-60px; top:-50px;
  transform: translate3d(calc(var(--mx,0)*24px), calc(var(--my,0)*18px), 0);
}
.shell{
  position:absolute;inset:32px;display:flex;flex-direction:column;gap:14px;
  padding:20px 22px;border-radius:22px;
  background:var(--shell);
  border:1px solid var(--border);
  box-shadow:0 28px 80px rgba(0,0,0,.18);
  backdrop-filter:blur(20px) saturate(1.2);
  color:var(--fg);
  transform: translate3d(calc(var(--mx,0)*6px), calc(var(--my,0)*4px), 0);
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-row{display:flex;align-items:center;gap:12px}
.logo-mark,.logo-img{
  width:44px;height:44px;border-radius:12px;object-fit:contain;
  display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;
  background:linear-gradient(135deg,var(--p),var(--s));
}
.logo-img{background:transparent;padding:2px}
.brand-name{font-weight:700;font-size:16px;line-height:1.2}
.brand-voice{font-size:12px;opacity:.58;margin-top:2px;max-width:520px}
.badge{
  padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;
  background:color-mix(in srgb, var(--p) 18%, transparent);
  border:1px solid color-mix(in srgb, var(--p) 40%, transparent);
  color:var(--fg);white-space:nowrap;
}
.headline{font-size:32px;line-height:1.12;letter-spacing:-.02em;font-weight:700;max-width:980px}
.sub{font-size:15px;line-height:1.45;color:var(--muted);max-width:920px;margin-top:6px}
.workspace{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
.panel{
  border-radius:16px;
  border:1px solid var(--border);
  background:var(--panel);
  padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0;
}
.panel-label{
  font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.5;
}
.input-box{
  flex:1;border-radius:14px;
  border:1.5px solid color-mix(in srgb, var(--p) 40%, transparent);
  background:var(--panel-strong);
  padding:14px 16px;font-size:16px;line-height:1.45;
  display:flex;align-items:center;gap:4px;
  box-shadow:0 0 0 0 color-mix(in srgb, var(--p) 0%, transparent);
  animation: inputPulse 2.4s ease-in-out infinite;
  position:relative;overflow:hidden;
}
@keyframes inputPulse{
  0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--p) 0%, transparent); border-color:color-mix(in srgb, var(--p) 35%, transparent)}
  50%{box-shadow:0 0 0 4px color-mix(in srgb, var(--p) 18%, transparent); border-color:color-mix(in srgb, var(--p) 70%, transparent)}
}
.input-prefix{opacity:.45;font-weight:600;flex:none}
.typed{color:var(--typed);font-weight:600;letter-spacing:.01em;min-height:1.2em}
.typed .accent{color:var(--p)}
.caret{
  display:inline-block;width:2px;height:1.1em;margin-left:2px;
  background:var(--p);border-radius:1px;vertical-align:-2px;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.scanline{
  position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--p) 70%, transparent), transparent);
  animation: scan 2.8s linear infinite;opacity:.5;pointer-events:none;
}
@keyframes scan{from{top:0}to{top:100%}}
.input-hint{font-size:11px;opacity:.45}
.result-box{
  flex:1;border-radius:14px;overflow:hidden;position:relative;
  background:linear-gradient(160deg, color-mix(in srgb, var(--p) 18%, var(--bg)), color-mix(in srgb, var(--s) 12%, var(--bg)));
  border:1px solid color-mix(in srgb, var(--p) 28%, transparent);
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:16px;gap:8px;
  opacity:0;transform:translateY(10px) scale(.98);
  transition:opacity .55s ease, transform .55s cubic-bezier(.2,.9,.3,1);
}
.result-box.show{opacity:1;transform:none}
.result-box.waiting{
  opacity:1;transform:none;
  align-items:center;justify-content:center;
  background:var(--panel);
  border-style:dashed;
}
.result-waiting{font-size:13px;opacity:.45;display:flex;align-items:center;gap:8px}
.spinner{
  width:14px;height:14px;border-radius:50%;
  border:2px solid var(--border);border-top-color:var(--p);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.result-score{
  font-size:42px;font-weight:700;letter-spacing:-.03em;color:var(--p);
  position:relative;z-index:1;
  animation: scorePop .55s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes scorePop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.result-label{font-size:14px;font-weight:600;position:relative;z-index:1;opacity:.9}
.result-samples{
  position:relative;z-index:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;
}
.result-sample{
  width:72px;height:72px;border-radius:14px;object-fit:contain;
  background:rgba(255,255,255,.92);border:1px solid var(--border);
  box-shadow:0 8px 20px rgba(0,0,0,.08);
  animation: scorePop .55s cubic-bezier(.2,1.3,.4,1) both;
}
.result-sample:nth-child(2){animation-delay:.08s}
.result-sample:nth-child(3){animation-delay:.16s}
.result-sample.hero{
  width:112px;height:112px;border-radius:18px;
}
.cta-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cta{
  display:inline-flex;align-items:center;gap:6px;
  padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;
  background:linear-gradient(135deg,var(--p),var(--s));color:#fff;
}
.meta{font-size:12px;opacity:.5}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .result-box{opacity:1;transform:none}
  .caret{opacity:1}
}
</style>

<body data-style="minimal-light" data-pattern="prompt-result">
  <div class="stage">
    <div class="bg"></div>
    <div class="noise"></div>
    <div class="glow"></div>
    <div class="shell">
      <div class="topbar">
        <div class="brand-row">
          <img class="logo-img" src="https://logo.restyart.com/logo-mark.png" alt="" />
          <div>
            <div class="brand-name">LogoStage</div>
            <div class="brand-voice">즉시형 — 입력 한 번으로 끝나는 결</div>
          </div>
        </div>
        <div class="badge">Design</div>
      </div>
      <div>
        <h1 class="headline">LogoStage - AI 로고 생성기</h1>
        <p class="sub">3가지 AI 엔진으로 완벽한 로고를 생성하세요. 지금 바로 당신의 맞춤 로고를 만들어보세요!</p>
      </div>
      <div class="workspace">
        <div class="panel">
          <div class="panel-label">Input · Prompt</div>
          <div class="input-box" id="inputBox" data-full="NEXUS — modern tech startup logo">
            <span class="scanline"></span>
            <span class="input-prefix">›</span>
            <span class="typed" id="typed"></span><span class="caret" id="caret"></span>
          </div>
          <div class="input-hint" id="inputHint">프롬프트를 입력하면 결과가 나타납니다…</div>
        </div>
        <div class="panel">
          <div class="panel-label">Result</div>
          <div class="result-box waiting" id="resultBox">
            <div class="result-waiting" id="resultWait"><span class="spinner"></span> 입력 대기 중</div>
            <div id="resultContent" hidden>
              <div class="result-samples"><img class="result-sample hero" src="https://logo.restyart.com/gallery/tech-startup.svg" alt="" /><img class="result-sample" src="https://logo.restyart.com/gallery/cafe-brand.svg" alt="" /><img class="result-sample" src="https://logo.restyart.com/gallery/fitness.svg" alt="" /></div><div class="result-label">Generated logo</div>
            </div>
          </div>
        </div>
      </div>
      <div class="cta-row">
        <div class="cta">로고 생성 →</div>
        <div class="meta">logo.restyart.com · prompt-result</div>
      </div>
    </div>
  </div>
<script>
(function(){
  const root = document.documentElement;
  const interactive = false;
  const fit = false;
  const captureAt = 1800;
  const W = 1200, H = 630;
  const stage = document.querySelector('.stage');
  const typedEl = document.getElementById('typed');
  const inputBox = document.getElementById('inputBox');
  const resultBox = document.getElementById('resultBox');
  const resultWait = document.getElementById('resultWait');
  const resultContent = document.getElementById('resultContent');
  const hint = document.getElementById('inputHint');
  const caret = document.getElementById('caret');
  const full = inputBox ? (inputBox.getAttribute('data-full') || '') : '';
  const doneHint = "생성 완료 · 로고 샘플이 반영되었습니다";
  const waitHint = "프롬프트를 입력하면 결과가 나타납니다…";

  function fitStage(){
    if(!stage) return;
    stage.style.transform = 'none';
    document.body.style.width = W + 'px';
    document.body.style.height = H + 'px';
  }
  fitStage();

  function showResult(){
    if(!resultBox) return;
    resultBox.classList.remove('waiting');
    if(resultWait) resultWait.hidden = true;
    if(resultContent) resultContent.hidden = false;
    requestAnimationFrame(function(){ resultBox.classList.add('show'); });
    if(hint) hint.textContent = doneHint;
    if(caret) caret.style.display = 'none';
  }

  function typeUrl(done){
    if(!typedEl || !full){ if(done) done(); return; }
    var i = 0;
    var speed = Math.max(18, Math.min(42, 900 / Math.max(8, full.length)));
    function step(){
      i++;
      typedEl.textContent = full.slice(0, i);
      if(i < full.length){
        setTimeout(step, speed + (Math.random()*18));
      } else if(done) done();
    }
    step();
  }

  root.style.setProperty('--mx', '0.08');
  root.style.setProperty('--my', '-0.04');
  document.body.classList.add('capture-ready');
  typeUrl(function(){
    showResult();
    setTimeout(function(){
      document.querySelectorAll('.bg,.glow,.input-box,.scanline,.caret,.spinner').forEach(function(el){
        el.style.animationPlayState = 'paused';
      });
      document.documentElement.setAttribute('data-capture-ready','1');
    }, Math.max(200, captureAt * 0.25));
  });
  setTimeout(function(){
    showResult();
    document.documentElement.setAttribute('data-capture-ready','1');
  }, Math.max(captureAt, 1600));
})();
</script>
