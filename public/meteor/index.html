    <style>

  <body>
    <main class="scene" id="scene" aria-label="Meteor shower scene">
      <canvas id="stars"></canvas>
      <canvas id="meteors"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="mountains" aria-hidden="true"></div>
      <div class="hint">화면을 클릭하면 유성우가 떨어져요</div>
      <div class="action-row" aria-label="actions">
        <button id="switchBgBtn" class="switch-btn" type="button" aria-label="Change background">🪐 배경 바꾸기</button>
        <button id="photoBtn" class="photo-btn" type="button" aria-label="Take photo">📸 사진찍기</button>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>

    <script>
      const starsCanvas = document.getElementById('stars');
      const starsCtx = starsCanvas.getContext('2d');
      const meteorCanvas = document.getElementById('meteors');
      const meteorCtx = meteorCanvas.getContext('2d');
      const scene = document.getElementById('scene');
      const switchBgBtn = document.getElementById('switchBgBtn');
      const photoBtn = document.getElementById('photoBtn');
      const toast = document.getElementById('toast');
      const MOBILE_BACKGROUND_SOURCES = ['./meteor.png', './meteor1.png', './meteor2.png', './meteor4.png', './meteor5.png'];
      const PC_BACKGROUND_SOURCES = ['./pc2.png', './pc3.png', './pc4.png'];
      const backgroundCache = new Map();
      let activeMobileBackgroundIndex = 0;
      let activePcBackgroundIndex = 0;
      let backgroundImage = new Image();
      backgroundImage.src = MOBILE_BACKGROUND_SOURCES[0];

      let width = 0;
      let height = 0;
      let stars = [];
      let microParticles = [];
      let meteors = [];
      let lastTime = performance.now();
      let randomCooldown = 0;
      let skyFlash = 0;
      let flashX = 0;
      let flashY = 0;
      const BLUE_METEOR_CHANCE = 0.12;
      const RED_METEOR_CHANCE = 0.07;

      const WARM_METEOR = {
        head: 'rgba(246, 252, 255, 0.98)',
        mid: 'rgba(202, 229, 255, 0.92)',
        tail: 'rgba(132, 184, 255, 0)',
        shadow: 'rgba(188, 226, 255, 0.78)',
        core: 'rgba(236, 247, 255, 0.96)',
        spark: 'rgba(199, 230, 255, 0.85)',
      };

      const BLUE_METEOR = {
        head: 'rgba(232, 252, 255, 1)',
        mid: 'rgba(122, 222, 255, 0.97)',
        tail: 'rgba(54, 149, 255, 0)',
        shadow: 'rgba(94, 212, 255, 0.95)',
        core: 'rgba(220, 248, 255, 0.99)',
        spark: 'rgba(144, 222, 255, 0.9)',
      };

      const RED_METEOR = {
        head: 'rgba(255, 236, 236, 0.98)',
        mid: 'rgba(255, 126, 140, 0.95)',
        tail: 'rgba(255, 82, 118, 0)',
        shadow: 'rgba(255, 112, 128, 0.92)',
        core: 'rgba(255, 214, 214, 0.98)',
        spark: 'rgba(255, 160, 173, 0.88)',
      };

      function preloadImage(src) {
        if (backgroundCache.has(src)) {
          return backgroundCache.get(src);
        }

        const p = new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve({ ok: true, img });
          img.onerror = () => resolve({ ok: false, img: null });
          img.src = src;
        });

        backgroundCache.set(src, p);
        return p;
      }

      function isWideViewport() {
        return width >= 980 || width / Math.max(height, 1) >= 1.33;
      }

      function currentSources() {
        return isWideViewport() ? PC_BACKGROUND_SOURCES : MOBILE_BACKGROUND_SOURCES;
      }

      function currentActiveIndex() {
        return isWideViewport() ? activePcBackgroundIndex : activeMobileBackgroundIndex;
      }

      function setCurrentActiveIndex(next) {
        if (isWideViewport()) {
          activePcBackgroundIndex = next;
        } else {
          activeMobileBackgroundIndex = next;
        }
      }

      async function applyBackgroundByIndex(nextIndex, sources = currentSources()) {
        if (!sources.length) {
          return false;
        }

        const idx = ((nextIndex % sources.length) + sources.length) % sources.length;
        const src = sources[idx];
        const loaded = await preloadImage(src);
        if (!loaded.ok) {
          return false;
        }

        setCurrentActiveIndex(idx);
        backgroundImage = loaded.img;
        scene.style.setProperty('--bg-image', `url('${src}')`);
        return true;
      }

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        starsCanvas.width = width;
        starsCanvas.height = height;
        meteorCanvas.width = width;
        meteorCanvas.height = height;
        flashX = width * 0.5;
        flashY = height * 0.3;

        stars = Array.from({ length: Math.max(120, Math.floor((width * height) / 9000)) }, () => ({
          x: Math.random() * width,
          y: Math.random() * (height * 0.85),
          r: rand(0.4, 1.8),
          phase: rand(0, Math.PI * 2),
          speed: rand(0.4, 1.4),
          alpha: rand(0.2, 0.95),
        }));

        microParticles = Array.from({ length: Math.max(36, Math.floor((width * height) / 26000)) }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          r: rand(0.16, 0.52),
          driftX: rand(-5, 5),
          fallY: rand(7, 16),
          alpha: rand(0.12, 0.34),
          phase: rand(0, Math.PI * 2),
          pulse: rand(0.5, 1.3),
        }));

        void applyBackgroundByIndex(currentActiveIndex(), currentSources());
      }

      function drawStars(t, dt) {
        starsCtx.clearRect(0, 0, width, height);
        for (const s of stars) {
          const twinkle = 0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.phase);
          starsCtx.beginPath();
          starsCtx.fillStyle = `rgba(214, 232, 255, ${Math.min(1, s.alpha * (0.45 + twinkle * 0.75))})`;
          starsCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          starsCtx.fill();
        }

        // Tiny particles: subtle star/snow feeling, kept very small.
        for (const p of microParticles) {
          p.x += p.driftX * dt;
          p.y += p.fallY * dt;

          if (p.x < -2) p.x = width + 2;
          if (p.x > width + 2) p.x = -2;
          if (p.y > height + 2) {
            p.y = -2;
            p.x = Math.random() * width;
          }

          const pulse = 0.72 + 0.28 * Math.sin(t * 0.0012 * p.pulse + p.phase);
          starsCtx.beginPath();
          starsCtx.fillStyle = `rgba(220, 236, 255, ${Math.min(0.38, p.alpha * pulse)})`;
          starsCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          starsCtx.fill();
        }
      }

      function meteorScale() {
        return Math.min(1.35, Math.max(0.95, Math.min(width, height) / 520));
      }

      function createMeteor(startX, startY, targetX, targetY, speedScale = 1) {
        const dx = targetX - startX;
        const dy = targetY - startY;
        const distance = Math.hypot(dx, dy) || 1;
        const speed = rand(440, 760) * speedScale;
        const vx = (dx / distance) * speed;
        const vy = (dy / distance) * speed;
        const roll = Math.random();
        const palette = roll < RED_METEOR_CHANCE
          ? RED_METEOR
          : roll < RED_METEOR_CHANCE + BLUE_METEOR_CHANCE
            ? BLUE_METEOR
            : WARM_METEOR;
        const scale = meteorScale();
        const big = Math.random() < 0.18;

        meteors.push({
          x: startX,
          y: startY,
          vx,
          vy,
          life: distance / speed + rand(0.08, 0.2),
          age: 0,
          tail: rand(big ? 210 : 150, big ? 340 : 250) * scale,
          glow: rand(big ? 22 : 16, big ? 36 : 26) * scale,
          size: rand(big ? 5.4 : 3.6, big ? 8.2 : 6.2) * scale,
          impactX: targetX,
          impactY: targetY,
          palette,
        });
      }

      function createRandomMeteor() {
        const startX = rand(-width * 0.12, width * 0.72);
        const startY = rand(-height * 0.06, height * 0.22);
        const targetX = startX + rand(width * 0.12, width * 0.32);
        const targetY = startY + rand(height * 0.38, height * 0.78);
        createMeteor(startX, startY, targetX, targetY, rand(0.95, 1.18));
      }

      function burstAt(x, y) {
        const count = 1;
        for (let i = 0; i < count; i += 1) {
          const tx = x + rand(-26, 26);
          const ty = y + rand(-20, 20);
          const sx = tx - rand(120, 260);
          const sy = ty - rand(90, 200);
          createMeteor(sx, sy, tx, ty, rand(0.95, 1.2));
        }
      }

      function drawMeteor(m) {
        const angle = Math.atan2(m.vy, m.vx);
        const tailX = m.x - Math.cos(angle) * m.tail;
        const tailY = m.y - Math.sin(angle) * m.tail;

        const grad = meteorCtx.createLinearGradient(m.x, m.y, tailX, tailY);
        grad.addColorStop(0, m.palette.head);
        grad.addColorStop(0.14, m.palette.mid);
        grad.addColorStop(1, m.palette.tail);

        meteorCtx.save();
        meteorCtx.lineCap = 'round';
        meteorCtx.strokeStyle = grad;
        meteorCtx.globalAlpha = 0.32;
        meteorCtx.lineWidth = m.size * 2.15;
        meteorCtx.beginPath();
        meteorCtx.moveTo(m.x, m.y);
        meteorCtx.lineTo(tailX, tailY);
        meteorCtx.stroke();
        meteorCtx.globalAlpha = 1;
        meteorCtx.lineWidth = m.size * 1.12;
        meteorCtx.beginPath();
        meteorCtx.moveTo(m.x, m.y);
        meteorCtx.lineTo(tailX, tailY);
        meteorCtx.stroke();

        meteorCtx.shadowBlur = m.glow;
        meteorCtx.shadowColor = m.palette.shadow;
        meteorCtx.fillStyle = m.palette.core;
        meteorCtx.beginPath();
        meteorCtx.arc(m.x, m.y, m.size * 0.92, 0, Math.PI * 2);
        meteorCtx.fill();
        meteorCtx.restore();
      }

      function animate(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        drawStars(now, dt);
        meteorCtx.clearRect(0, 0, width, height);

        randomCooldown -= dt;
        if (randomCooldown <= 0) {
          createRandomMeteor();
          if (Math.random() < 0.3) {
            createRandomMeteor();
          }
          randomCooldown = rand(0.7, 2.1);
        }

        for (let i = meteors.length - 1; i >= 0; i -= 1) {
          const m = meteors[i];
          m.age += dt;
          m.x += m.vx * dt;
          m.y += m.vy * dt;

          drawMeteor(m);

          if (m.x >= -40 && m.x <= width + 40 && m.y >= -40 && m.y <= height + 40) {
            const lifeLeft = Math.max(0, 1 - (m.age / Math.max(m.life, 0.0001)));
            const paletteBoost = m.palette === BLUE_METEOR ? 1.25 : m.palette === RED_METEOR ? 1.1 : 1;
            skyFlash = Math.min(0.09, skyFlash + (lifeLeft * m.size * paletteBoost * dt * 0.045));
            flashX += (m.x - flashX) * 0.11;
            flashY += (m.y - flashY) * 0.11;
          }

          if (m.age >= m.life || m.x > width + 120 || m.y > height + 120) {
            meteors.splice(i, 1);
          }
        }

        // Subtle atmospheric lift while meteors pass.
        skyFlash *= Math.exp(-dt * 7.8);
        if (skyFlash > 0.0012) {
          meteorCtx.save();
          meteorCtx.globalCompositeOperation = 'screen';

          const radius = Math.max(width, height) * 0.62;
          const glow = meteorCtx.createRadialGradient(flashX, flashY, 0, flashX, flashY, radius);
          glow.addColorStop(0, `rgba(194, 222, 255, ${Math.min(0.1, skyFlash * 1.15)})`);
          glow.addColorStop(1, 'rgba(194, 222, 255, 0)');
          meteorCtx.fillStyle = glow;
          meteorCtx.fillRect(0, 0, width, height);

          meteorCtx.fillStyle = `rgba(178, 210, 255, ${Math.min(0.035, skyFlash * 0.42)})`;
          meteorCtx.fillRect(0, 0, width, height);
          meteorCtx.restore();
        }
        requestAnimationFrame(animate);
      }

      function showToast(message, hold = 1400) {
        toast.textContent = message;
        toast.classList.add('show');
        window.clearTimeout(showToast._timer);
        showToast._timer = window.setTimeout(() => {
          toast.classList.remove('show');
        }, hold);
      }

      function drawCoverImage(ctx, img, w, h) {
        if (!img || !img.naturalWidth || !img.naturalHeight) {
          return;
        }
        const imageRatio = img.naturalWidth / img.naturalHeight;
        const viewRatio = w / h;
        let sx = 0;
        let sy = 0;
        let sw = img.naturalWidth;
        let sh = img.naturalHeight;

        if (imageRatio > viewRatio) {
          sw = img.naturalHeight * viewRatio;
          sx = (img.naturalWidth - sw) * 0.5;
        } else {
          sh = img.naturalWidth / viewRatio;
          sy = (img.naturalHeight - sh) * 0.5;
        }

        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      }

      function drawSceneOverlays(ctx, w, h) {
        const g1 = ctx.createRadialGradient(w * 0.5, h * 0.2, 0, w * 0.5, h * 0.2, w * 0.6);
        g1.addColorStop(0, 'rgba(117, 152, 255, 0.14)');
        g1.addColorStop(1, 'rgba(117, 152, 255, 0)');
        ctx.fillStyle = g1;
        ctx.fillRect(0, 0, w, h);

        const g2 = ctx.createRadialGradient(w * 0.12, h * 0.4, 0, w * 0.12, h * 0.4, w * 0.45);
        g2.addColorStop(0, 'rgba(70, 104, 224, 0.11)');
        g2.addColorStop(1, 'rgba(70, 104, 224, 0)');
        ctx.fillStyle = g2;
        ctx.fillRect(0, 0, w, h);

        const g3 = ctx.createRadialGradient(w * 0.88, h * 0.46, 0, w * 0.88, h * 0.46, w * 0.45);
        g3.addColorStop(0, 'rgba(74, 108, 220, 0.09)');
        g3.addColorStop(1, 'rgba(74, 108, 220, 0)');
        ctx.fillStyle = g3;
        ctx.fillRect(0, 0, w, h);

        const wash = ctx.createLinearGradient(0, 0, 0, h);
        wash.addColorStop(0, 'rgba(3, 7, 18, 0.32)');
        wash.addColorStop(1, 'rgba(3, 7, 18, 0.46)');
        ctx.fillStyle = wash;
        ctx.fillRect(0, 0, w, h);

        const vignette = ctx.createRadialGradient(w * 0.5, h * 0.52, Math.min(w, h) * 0.25, w * 0.5, h * 0.52, Math.max(w, h) * 0.75);
        vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
        vignette.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, w, h);

        const mountainY = h * 0.78;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(0, h);
        ctx.lineTo(0.08 * w, 0.71 * h);
        ctx.lineTo(0.15 * w, 0.82 * h);
        ctx.lineTo(0.24 * w, 0.61 * h);
        ctx.lineTo(0.36 * w, 0.83 * h);
        ctx.lineTo(0.47 * w, 0.53 * h);
        ctx.lineTo(0.62 * w, 0.84 * h);
        ctx.lineTo(0.76 * w, 0.67 * h);
        ctx.lineTo(0.9 * w, 0.86 * h);
        ctx.lineTo(w, 0.73 * h);
        ctx.lineTo(w, h);
        ctx.closePath();
        ctx.clip();
        const mountainGrad = ctx.createLinearGradient(0, mountainY, 0, h);
        mountainGrad.addColorStop(0, 'rgba(9, 16, 33, 0)');
        mountainGrad.addColorStop(0.2, 'rgba(5, 10, 23, 0.2)');
        mountainGrad.addColorStop(1, 'rgba(4, 8, 20, 0.9)');
        ctx.fillStyle = mountainGrad;
        ctx.fillRect(0, mountainY, w, h - mountainY);
        ctx.restore();
      }

      function renderCaptureCanvas() {
        const out = document.createElement('canvas');
        out.width = width;
        out.height = height;
        const ctx = out.getContext('2d');

        drawCoverImage(ctx, backgroundImage, width, height);
        drawSceneOverlays(ctx, width, height);
        ctx.drawImage(starsCanvas, 0, 0, width, height);
        ctx.drawImage(meteorCanvas, 0, 0, width, height);

        return out;
      }

      function canvasToBlob(canvas) {
        return new Promise((resolve) => {
          canvas.toBlob((blob) => resolve(blob), 'image/png');
        });
      }

      async function shareOrDownload(blob) {
        const fileName = `meteor-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
        const file = new File([blob], fileName, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
          await navigator.share({ files: [file], title: 'Meteor Shot' });
          return;
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1200);
      }

      async function capturePhoto() {
        if (photoBtn.disabled) {
          return;
        }
        photoBtn.disabled = true;
        showToast('사진 준비중...');
        try {
          const captureCanvas = renderCaptureCanvas();
          const blob = await canvasToBlob(captureCanvas);
          if (!blob) {
            throw new Error('blob-failed');
          }
          await shareOrDownload(blob);
          showToast('저장/공유 완료!');
        } catch (err) {
          showToast('사진 저장을 다시 시도해 주세요.', 1800);
        } finally {
          setTimeout(() => {
            photoBtn.disabled = false;
          }, 400);
        }
      }

      async function toggleBackground() {
        if (switchBgBtn.disabled) {
          return;
        }

        switchBgBtn.disabled = true;
        const sources = currentSources();
        const now = currentActiveIndex();
        const nextIndex = (now + 1) % sources.length;
        const ok = await applyBackgroundByIndex(nextIndex, sources);
        if (!ok) {
          const miss = sources[nextIndex].replace('./', '');
          showToast(`${miss} 파일을 찾지 못했어요.`, 1800);
        } else {
          const activeName = sources[nextIndex].replace('./', '').replace('.png', '');
          showToast(`${activeName} 배경으로 교체!`);
        }
        setTimeout(() => {
          switchBgBtn.disabled = false;
        }, 280);
      }

      function pointerToScene(e) {
        const rect = scene.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        return { x, y };
      }

      scene.addEventListener('pointerdown', (e) => {
        const p = pointerToScene(e);
        burstAt(p.x, p.y);
      });

      photoBtn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
      });
      switchBgBtn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
      });
      photoBtn.addEventListener('click', capturePhoto);
      switchBgBtn.addEventListener('click', toggleBackground);

      window.addEventListener('resize', resize);

      resize();
      preloadImage(MOBILE_BACKGROUND_SOURCES[0]).then((loaded) => {
        if (loaded.ok) {
          backgroundImage = loaded.img;
        }
      });
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
