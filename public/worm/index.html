<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   꿈틀꿈틀 지렁이 — 멀티 웜 버전
   Worm 클래스: 스파인 체인 + 파동 기어가기 + 연동운동 + 패닉 도망
   ========================================================= */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x241b12);
scene.fog = new THREE.Fog(0x241b12, 12, 26);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 6.8, 6.4);
camera.lookAt(0, 0, 0.2);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

/* ---------- 조명 ---------- */
scene.add(new THREE.HemisphereLight(0xfff0dc, 0x3a2a1a, 0.85));
const sun = new THREE.DirectionalLight(0xfff4e2, 1.15);
sun.position.set(5, 9, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x88aaff, 0.25);
rim.position.set(-6, 4, -5);
scene.add(rim);

/* ---------- 흙 바닥 ---------- */
function makeSoilTexture(){
  const c = document.createElement("canvas"); c.width = c.height = 512;
  const g = c.getContext("2d");
  g.fillStyle = "#4a3524"; g.fillRect(0,0,512,512);
  for(let i=0;i<9000;i++){
    const x=Math.random()*512, y=Math.random()*512, r=Math.random()*1.8+0.3;
    const tones = ["#3a2818","#55402c","#5f4a33","#2e2013","#6b543c"];
    g.fillStyle = tones[(Math.random()*tones.length)|0];
    g.globalAlpha = 0.5+Math.random()*0.5;
    g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  g.globalAlpha = 1;
  for(let i=0;i<70;i++){
    const x=Math.random()*512, y=Math.random()*512, r=Math.random()*3+1.5;
    g.fillStyle = `rgb(${120+Math.random()*50|0},${105+Math.random()*40|0},${88+Math.random()*30|0})`;
    g.beginPath(); g.arc(x,y,r,0,7); g.fill();
    g.fillStyle = "rgba(0,0,0,.3)";
    g.beginPath(); g.arc(x+r*0.4,y+r*0.5,r*0.8,0,7); g.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3,3);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(16, 48),
  new THREE.MeshPhongMaterial({ map: makeSoilTexture(), shininess: 4 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- 소품 ---------- */
(function scatterProps(){
  const pebbleMat = new THREE.MeshPhongMaterial({ color:0x8d8478, shininess:8, flatShading:true });
  for(let i=0;i<7;i++){
    const p = new THREE.Mesh(new THREE.DodecahedronGeometry(0.22+Math.random()*0.25, 0), pebbleMat);
    const a = Math.random()*Math.PI*2, d = 3.6+Math.random()*3.6;
    p.position.set(Math.cos(a)*d, 0.1, Math.sin(a)*d);
    p.scale.y = 0.55;
    p.rotation.set(Math.random(),Math.random()*6,Math.random());
    p.castShadow = p.receiveShadow = true;
    scene.add(p);
  }
  const leafMat = new THREE.MeshPhongMaterial({ color:0x6b6431, shininess:20, side:THREE.DoubleSide });
  for(let i=0;i<4;i++){
    const leaf = new THREE.Mesh(new THREE.CircleGeometry(0.4, 7), leafMat.clone());
    leaf.material.color.offsetHSL(0, 0, (Math.random()-0.5)*0.1);
    const a = Math.random()*Math.PI*2, d = 3.2+Math.random()*4;
    leaf.position.set(Math.cos(a)*d, 0.015, Math.sin(a)*d);
    leaf.rotation.x = -Math.PI/2;
    leaf.rotation.z = Math.random()*6;
    leaf.scale.set(1, 1.6, 1);
    leaf.receiveShadow = true;
    scene.add(leaf);
  }
})();

/* ---------- 지렁이 팔레트 & 피부 텍스처 ---------- */
const PALETTES = [
  { stops:["#8e4d40","#a85a4b","#b06352","#bd7663"], band:"233,178,150", cap:0x9a5346 }, // 기본 적갈색
  { stops:["#96504a","#b26059","#c06e64","#cc8578"], band:"240,185,165", cap:0xa85b52 }, // 분홍기
  { stops:["#7a4436","#8f5040","#9a5c49","#a86e58"], band:"215,160,130", cap:0x8a4c3e }, // 진한 흙색
  { stops:["#a06355","#b57263","#c48172","#d09484"], band:"245,200,180", cap:0xac6a5b }, // 연한 살구
];
function makeWormTextures(p){
  const W = 1024, H = 128;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0,0,W,0);
  grad.addColorStop(0.00, p.stops[0]);
  grad.addColorStop(0.15, p.stops[1]);
  grad.addColorStop(0.55, p.stops[2]);
  grad.addColorStop(1.00, p.stops[3]);
  g.fillStyle = grad; g.fillRect(0,0,W,H);
  // 환대(클리텔룸)
  const band = g.createLinearGradient(W*0.20,0,W*0.34,0);
  band.addColorStop(0,`rgba(${p.band},0)`);
  band.addColorStop(0.5,`rgba(${p.band},0.95)`);
  band.addColorStop(1,`rgba(${p.band},0)`);
  g.fillStyle = band; g.fillRect(W*0.18,0,W*0.18,H);
  // 체절 링
  for(let x=6; x<W; x+=9){
    g.fillStyle = "rgba(60,25,18,0.28)"; g.fillRect(x,0,2,H);
    g.fillStyle = "rgba(255,220,200,0.10)"; g.fillRect(x+2,0,1.5,H);
  }
  g.fillStyle = "rgba(90,30,25,0.35)";
  g.fillRect(0,H*0.47,W,H*0.06);
  const map = new THREE.CanvasTexture(c);
  map.encoding = THREE.sRGBEncoding;

  const b = document.createElement("canvas"); b.width = W; b.height = H;
  const bg = b.getContext("2d");
  bg.fillStyle = "#808080"; bg.fillRect(0,0,W,H);
  for(let x=6; x<W; x+=9){
    bg.fillStyle = "#3a3a3a"; bg.fillRect(x,0,2.5,H);
    bg.fillStyle = "#b5b5b5"; bg.fillRect(x+3,0,1.5,H);
  }
  return { map, bump: new THREE.CanvasTexture(b) };
}

/* ---------- Worm 클래스 ---------- */
const SEG = 46, TUBULAR = 64, RADIAL = 11;

class Worm {
  constructor({x=0, z=0, scale=1, palette=PALETTES[0]}={}){
    this.scale = scale;
    this.SPACING = 0.155 * scale;
    this.BASE_R = 0.13 * scale;
    this.heading = Math.random()*Math.PI*2;
    this.panic = 0;
    this.squash = 0; this.squashT = 0.5;
    this.phase = Math.random()*100;         // 개체별 위상 (움직임 비동기화)
    this.speedMul = 0.8 + Math.random()*0.5; // 개체별 성격
    this.stress = 0;          // 누적 스트레스 (많이 만지면 증가)
    this.state = "roam";      // roam | digging | hidden | rising
    this.dig = 0;             // 땅속 진행도
    this.hiddenT = 0;
    this.fleeFrom = null;
    this.spine = [];
    for(let i=0;i<SEG;i++){
      this.spine.push(new THREE.Vector3(
        x - Math.cos(this.heading)*i*this.SPACING, 0,
        z - Math.sin(this.heading)*i*this.SPACING
      ));
    }
    this.renderPts = Array.from({length:SEG}, ()=>new THREE.Vector3());

    const tex = makeWormTextures(palette);
    this.mat = new THREE.MeshPhongMaterial({
      map: tex.map, bumpMap: tex.bump, bumpScale: 0.006,
      shininess: 95, specular: new THREE.Color(0xffe8d8),
    });
    this.mesh = new THREE.Mesh(new THREE.BufferGeometry(), this.mat);
    this.mesh.castShadow = true;
    const capMat = new THREE.MeshPhongMaterial({ color:palette.cap, shininess:95, specular:0xffe8d8 });
    this.headCap = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), capMat);
    this.tailCap = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), capMat);
    this.headCap.castShadow = this.tailCap.castShadow = true;
    scene.add(this.mesh, this.headCap, this.tailCap);
  }

  radiusAt(t, time){
    const tt = Math.min(Math.max(t, 0.001), 0.999);
    const shape = Math.pow(Math.sin(Math.PI*tt), 0.45);
    let r = this.BASE_R * (0.22 + 0.78*shape);
    r *= 1 + 0.09*Math.sin(tt*24 - (time+this.phase)*6.5 - this.panic*3);
    if(this.squash > 0.01){
      const d = tt - this.squashT;
      r *= 1 - this.squash*0.45*Math.exp(-(d*d)/0.008);
    }
    return r;
  }

  step(dt, time, pointerPt){
    const t = time + this.phase;
    const head = this.spine[0];
    const B = BOUNDS;

    /* --- 땅속 상태 머신 --- */
    if(this.state === "digging"){
      this.dig += dt*0.75;
      head.x += Math.cos(this.heading)*0.4*dt;
      head.z += Math.sin(this.heading)*0.4*dt;
      this.followChain();
      if(this.dig >= 1.45){
        this.state = "hidden";
        this.mesh.visible = this.headCap.visible = this.tailCap.visible = false;
        this.hiddenT = 2.5 + Math.random()*2.5;
      }
      return;
    }
    if(this.state === "hidden"){
      this.hiddenT -= dt;
      if(this.hiddenT <= 0){
        const nx = B.minX + (0.15+Math.random()*0.7)*(B.maxX-B.minX);
        const nz = B.minZ + (0.15+Math.random()*0.7)*(B.maxZ-B.minZ);
        this.heading = Math.random()*Math.PI*2;
        for(let i=0;i<SEG;i++){
          this.spine[i].set(nx - Math.cos(this.heading)*i*this.SPACING, 0,
                            nz - Math.sin(this.heading)*i*this.SPACING);
        }
        this.mesh.visible = this.headCap.visible = this.tailCap.visible = true;
        this.state = "rising";
        spawnRipple(new THREE.Vector3(nx,0,nz), 0x8a6a48);
      }
      return;
    }
    if(this.state === "rising"){
      this.dig -= dt*0.8;
      if(this.dig <= 0){ this.dig = 0; this.state = "roam"; this.stress = 0; this.panic = 0.35; }
      return;
    }

    /* --- 손가락 피해서 몸 구부리기 (마디별 반발력) --- */
    if(pointerPt){
      const R = 1.05*this.scale + 0.15;
      for(let i=0;i<SEG;i++){
        const s = this.spine[i];
        const dx = s.x-pointerPt.x, dz = s.z-pointerPt.z;
        const d = Math.hypot(dx,dz);
        if(d < R && d > 0.001){
          const f = (R-d)/R * 2.8 * dt;
          s.x += dx/d*f; s.z += dz/d*f;
          this.panic = Math.min(1.5, this.panic + f*0.7);
          this.fleeFrom = pointerPt.clone();
        }
      }
      const dh = head.distanceTo(pointerPt);
      if(dh < 2.4){
        this.panic = Math.min(1.5, this.panic + (2.4-dh)*dt*3.0);
        this.fleeFrom = pointerPt.clone();
      }
    }
    this.panic *= Math.pow(0.42, dt);
    this.squash *= Math.pow(0.15, dt);

    /* --- 스트레스 누적: 너무 괴롭히면 땅속으로 --- */
    if(this.panic > 0.6) this.stress += dt*1.1;
    this.stress = Math.max(0, this.stress - dt*0.12);
    if(this.stress > 3){
      this.state = "digging"; this.dig = 0;
      spawnRipple(head.clone(), 0x8a6a48);
      return;
    }

    /* --- 방향: 배회 + 도망 + 동료 회피 --- */
    const wander = Math.sin(t*0.6)*0.9 + Math.sin(t*0.21+2.1)*0.6;
    this.heading += wander*dt*(0.7 + this.panic*1.6);

    if(this.fleeFrom && this.panic > 0.06){
      const away = Math.atan2(head.z-this.fleeFrom.z, head.x-this.fleeFrom.x);
      this.heading = lerpAngle(this.heading, away, dt*(2.5+this.panic*4));
    }
    for(const o of worms){
      if(o === this || o.state !== "roam") continue;
      for(let k=0;k<SEG;k+=9){
        const os = o.spine[k];
        const d = head.distanceTo(os);
        if(d < 0.8){
          const away = Math.atan2(head.z-os.z, head.x-os.x);
          this.heading = lerpAngle(this.heading, away, dt*2.2);
        }
      }
    }

    /* --- 화면 경계: 밖으로 못 나감 --- */
    const m = 0.9;
    if(head.x < B.minX+m || head.x > B.maxX-m || head.z < B.minZ+m || head.z > B.maxZ-m){
      const cx = (B.minX+B.maxX)/2, cz = (B.minZ+B.maxZ)/2;
      const back = Math.atan2(cz-head.z, cx-head.x);
      this.heading = lerpAngle(this.heading, back, dt*3.2);
    }

    const speed = (0.32 + this.panic*2.1)*this.speedMul;
    head.x += Math.cos(this.heading)*speed*dt;
    head.z += Math.sin(this.heading)*speed*dt;
    head.x = Math.min(Math.max(head.x, B.minX), B.maxX);
    head.z = Math.min(Math.max(head.z, B.minZ), B.maxZ);

    this.followChain();
  }

  followChain(){
    for(let i=1;i<SEG;i++){
      const prev = this.spine[i-1], cur = this.spine[i];
      const dx = cur.x-prev.x, dz = cur.z-prev.z;
      const d = Math.hypot(dx,dz) || 0.0001;
      cur.x = prev.x + dx/d*this.SPACING;
      cur.z = prev.z + dz/d*this.SPACING;
    }
  }

  sinkAt(t){
    if(this.dig <= 0) return 0;
    const wave = this.state === "rising"
      ? this.dig*1.7 - (1-t)*1.2   // 올라올 땐 머리부터 지상으로
      : this.dig*1.7 - t*1.2;      // 파고들 땐 머리부터 땅속으로
    return Math.min(Math.max(wave, 0), 1.7) * 0.55;
  }

  buildCurve(time){
    const amp = (0.045 + this.panic*0.16) * this.scale;
    const freq = 5.5 + this.panic*7;
    for(let i=0;i<SEG;i++){
      const t = i/(SEG-1);
      const p = this.spine[i];
      const nb = this.spine[Math.min(i+1,SEG-1)], pb = this.spine[Math.max(i-1,0)];
      let px = nb.z-pb.z, pz = -(nb.x-pb.x);
      const l = Math.hypot(px,pz)||1; px/=l; pz/=l;
      const env = Math.sin(Math.PI*t);
      const off = Math.sin(t*Math.PI*freq - (time+this.phase)*(6+this.panic*8)) * amp * env;
      this.renderPts[i].set(p.x+px*off, this.radiusAt(t,time)*0.92 - this.sinkAt(t), p.z+pz*off);
    }
    return new THREE.CatmullRomCurve3(this.renderPts);
  }

  rebuild(time){
    const curve = this.buildCurve(time);
    const geo = new THREE.TubeGeometry(curve, TUBULAR, 1, RADIAL, false);
    const pos = geo.attributes.position;
    const ringVerts = RADIAL+1;
    for(let i=0;i<=TUBULAR;i++){
      const t = i/TUBULAR;
      const c = curve.getPointAt(t);
      const r = this.radiusAt(t, time);
      for(let j=0;j<ringVerts;j++){
        const k = i*ringVerts+j;
        pos.setXYZ(k,
          c.x+(pos.getX(k)-c.x)*r,
          c.y+(pos.getY(k)-c.y)*r,
          c.z+(pos.getZ(k)-c.z)*r
        );
      }
    }
    pos.needsUpdate = true;
    geo.computeVertexNormals();
    this.mesh.geometry.dispose();
    this.mesh.geometry = geo;

    const hp = curve.getPointAt(0), tp = curve.getPointAt(1);
    this.headCap.position.copy(hp); this.headCap.scale.setScalar(this.radiusAt(0.004,time));
    this.tailCap.position.copy(tp); this.tailCap.scale.setScalar(this.radiusAt(0.996,time));
  }

  flinch(hitPoint){
    if(this.state !== "roam") return;
    this.stress += 0.55;
    this.panic = 1.5;
    this.fleeFrom = hitPoint.clone();
    let best = 0, bd = 1e9;
    for(let i=0;i<SEG;i++){
      const d = this.spine[i].distanceTo(hitPoint);
      if(d < bd){ bd = d; best = i; }
    }
    this.squash = 1; this.squashT = best/(SEG-1);
    for(let i=Math.max(0,best-7); i<Math.min(SEG,best+8); i++){
      const s = this.spine[i];
      const dx = s.x-hitPoint.x, dz = s.z-hitPoint.z;
      const d = Math.hypot(dx,dz)||0.001;
      const push = 0.34*(1-Math.abs(i-best)/8);
      s.x += dx/d*push; s.z += dz/d*push;
    }
  }

  dispose(){
    scene.remove(this.mesh, this.headCap, this.tailCap);
    this.mesh.geometry.dispose();
    this.mat.map.dispose(); this.mat.bumpMap.dispose(); this.mat.dispose();
    this.headCap.geometry.dispose(); this.headCap.material.dispose();
  }
}

function lerpAngle(a,b,t){
  let d = b-a;
  while(d>Math.PI) d-=Math.PI*2;
  while(d<-Math.PI) d+=Math.PI*2;
  return a + d*Math.min(1,t);
}

/* ---------- 지렁이 관리 + 버튼 ---------- */
const worms = [];
const MAX_WORMS = 8;
const btnAdd = document.getElementById("btnAdd");
const btnRemove = document.getElementById("btnRemove");

function updateBtn(){
  btnAdd.textContent = `🪱 지렁이 추가 (${worms.length}/${MAX_WORMS})`;
  btnRemove.style.display = worms.length > 1 ? "" : "none";
}
function addWorm(first=false){
  if(worms.length >= MAX_WORMS){
    btnAdd.classList.remove("deny"); void btnAdd.offsetWidth;
    btnAdd.classList.add("deny");
    return;
  }
  const a = Math.random()*Math.PI*2;
  const d = first ? 0 : 1.5+Math.random()*2.5;
  const w = new Worm({
    x: Math.cos(a)*d, z: Math.sin(a)*d,
    scale: first ? 1 : 0.75 + Math.random()*0.55,
    palette: PALETTES[(Math.random()*PALETTES.length)|0],
  });
  if(!first){
    w.panic = 0.6; // 태어나자마자 꿈틀!
    spawnRipple(new THREE.Vector3(Math.cos(a)*d, 0, Math.sin(a)*d));
  }
  worms.push(w);
  updateBtn();
}
function removeWorm(){
  if(worms.length <= 1) return;
  worms.pop().dispose();
  updateBtn();
}
btnAdd.addEventListener("click", (e)=>{ e.stopPropagation(); addWorm(); });
btnRemove.addEventListener("click", (e)=>{ e.stopPropagation(); removeWorm(); });

/* ---------- 입력 ---------- */
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const ndc = new THREE.Vector2();
let pointerPt = null;

/* 화면 모서리를 지면에 역투영해서 이동 가능 영역 계산 */
let BOUNDS = { minX:-4.5, maxX:4.5, minZ:-3.5, maxZ:4.5 };
const ndcTmp = new THREE.Vector2();
const boundsHit = new THREE.Vector3();
function computeBounds(){
  const corners = [[-0.92,-0.92],[0.92,-0.92],[-0.92,0.32],[0.92,0.32]];
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  for(const [nx,ny] of corners){
    raycaster.setFromCamera(ndcTmp.set(nx,ny), camera);
    if(raycaster.ray.intersectPlane(groundPlane, boundsHit)){
      minX=Math.min(minX,boundsHit.x); maxX=Math.max(maxX,boundsHit.x);
      minZ=Math.min(minZ,boundsHit.z); maxZ=Math.max(maxZ,boundsHit.z);
    }
  }
  BOUNDS = {
    minX: Math.max(minX+0.5, -7.5), maxX: Math.min(maxX-0.5, 7.5),
    minZ: Math.max(minZ+0.4, -6.5), maxZ: Math.min(maxZ-0.4, 5.6),
  };
}
computeBounds();

function toGround(e){
  const x = (e.touches ? e.touches[0].clientX : e.clientX);
  const y = (e.touches ? e.touches[0].clientY : e.clientY);
  ndc.set(x/innerWidth*2-1, -(y/innerHeight)*2+1);
  raycaster.setFromCamera(ndc, camera);
  const out = new THREE.Vector3();
  return raycaster.ray.intersectPlane(groundPlane, out) ? out : null;
}
function onMove(e){ pointerPt = toGround(e); }
function onDown(e){
  if(e.target !== renderer.domElement) return; // 버튼 클릭은 무시
  document.getElementById("ui").classList.add("hide");
  pointerPt = toGround(e);
  if(!pointerPt) return;
  spawnRipple(pointerPt);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(worms.filter(w=>w.mesh.visible).map(w=>w.mesh))[0];
  if(hit){
    const w = worms.find(w=>w.mesh === hit.object);
    if(w) w.flinch(hit.point);
  } else {
    for(const w of worms){
      if(pointerPt.distanceTo(w.spine[0]) < 3){
        w.panic = Math.min(1.5, w.panic + 0.7);
        w.fleeFrom = pointerPt.clone();
      }
    }
  }
}
function onUp(){ setTimeout(()=>{ pointerPt = null; }, 120); }

addEventListener("pointermove", onMove, {passive:true});
addEventListener("pointerdown", onDown, {passive:true});
addEventListener("pointerup", onUp, {passive:true});
addEventListener("touchmove", onMove, {passive:true});

/* ---------- 터치 파문 ---------- */
const ripples = [];
const rippleGeo = new THREE.RingGeometry(0.15, 0.2, 32);
function spawnRipple(pt, color=0xf3e6d0){
  const m = new THREE.Mesh(rippleGeo, new THREE.MeshBasicMaterial({
    color, transparent:true, opacity:0.7, side:THREE.DoubleSide
  }));
  m.rotation.x = -Math.PI/2;
  m.position.set(pt.x, 0.02, pt.z);
  scene.add(m);
  ripples.push({ mesh:m, life:0 });
}
function stepRipples(dt){
  for(let i=ripples.length-1;i>=0;i--){
    const r = ripples[i];
    r.life += dt;
    r.mesh.scale.setScalar(1 + r.life*6);
    r.mesh.material.opacity = 0.7*(1 - r.life/0.7);
    if(r.life > 0.7){
      scene.remove(r.mesh);
      r.mesh.material.dispose();
      ripples.splice(i,1);
    }
  }
}

/* ---------- 루프 ---------- */
addWorm(true);
let time = 0, last = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  time += dt;
  for(const w of worms){ w.step(dt, time, pointerPt); if(w.mesh.visible) w.rebuild(time); }
  stepRipples(dt);
  camera.position.x = Math.sin(time*0.15)*0.25;
  camera.lookAt(0,0,0.2);
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  computeBounds();
});
</script>
