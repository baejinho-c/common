# chicken-landing.restyart.com → common 게이트웨이 (:4000)
# 적용:
#   sudo cp common/scripts/nginx-chicken-landing.conf /etc/nginx/conf.d/chicken-landing-restyart.conf
#   sudo nginx -t && sudo certbot --nginx -d chicken-landing.restyart.com --non-interactive --agree-tos --email baeno@nate.com

server {
    listen 80;
    server_name chicken-landing.restyart.com;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
